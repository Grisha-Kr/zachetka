<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Моя зачётка</title>
<meta name="description" content="Учёт учёбы: предметы, задания, сессии и дипломные работы">
<meta name="theme-color" content="#f1f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10161b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Зачётка">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/app.css?v=9">
<script>try{var t=JSON.parse(localStorage.getItem('zach_theme')||'""');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body>

<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><h1>Моя зачётка</h1><p id="auth-sub">Предметы, задания, сессии и дипломы в одном месте.</p></div>
    <div id="auth-body"></div>
  </div>
</section>

<div id="app" hidden>
<header class="top">
  <div class="top-in">
    <div class="brand"><h1>Моя зачётка</h1><span class="today" id="today"></span></div>
    <span class="grow"></span>
    <nav class="tabs" id="tabs" aria-label="Разделы">
      <button class="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Главная</button>
      <button class="tab" data-tab="subjects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 012-2h13v16H6a2 2 0 00-2 2z"/><path d="M4 19V5"/><path d="M9 8h6"/></svg>Предметы</button>
      <button class="tab" data-tab="tasks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/></svg>Задания</button>
      <button class="tab" data-tab="sessions"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Сессии</button>
      <button class="tab" data-tab="thesis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 00-2 2v14a2 2 0 002 2h12a2 2 0 002-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Диплом</button>
    </nav>
    <button class="icon-btn" id="theme-btn" type="button" title="Тёмная тема" aria-label="Тёмная тема"></button>
    <button class="icon-btn" data-tab="account" title="Профиль и настройки" aria-label="Профиль и настройки"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></button>
  </div>
</header>
<div class="update-bar" id="update-bar" hidden><div><span>Вышло обновление приложения.</span><button type="button" class="btn sm primary" id="update-btn">Обновить</button><button type="button" class="icon-btn" id="update-close" aria-label="Скрыть">×</button></div></div>
<div class="notice" id="notice" hidden><div id="notice-text"></div></div>
<main id="main"><div class="loading">Загружаю данные…</div></main>
</div>

<dialog id="dlg"><form id="dlg-form" novalidate></form></dialog>
<dialog id="viewer" aria-label="Просмотр файла"><div class="v-head"><h2 id="v-title"></h2><button type="button" class="btn sm" id="v-dl">Скачать</button><button type="button" class="icon-btn" id="v-close" aria-label="Закрыть">×</button></div><div class="v-body" id="v-body"></div></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="/vendor/pocketbase.umd.js"></script>
<script src="/app.js?v=8"></script>
</body>
</html>
